# Builds the installers with the built-in voice, checks the voice actually
# speaks on each OS, and publishes a GitHub Release.
#
#   Release:  merge to main with a new version in src-tauri/tauri.conf.json
#             (and package.json / Cargo.toml). If there's no release for that
#             version yet, it's built and published as v<version>, the Latest
#             release that the install scripts and Update button use. A push
#             to main that keeps the version builds nothing.
#   Beta:     push to the `beta` branch. Builds and replaces the one rolling
#             pre-release, tag `beta-latest`: a stable link for testers.
#             Pre-releases are skipped by the Update button and install scripts.
#   By hand:  push a version tag (git tag v0.2.0 && git push origin v0.2.0;
#             a dash, v0.2.0-beta.1, makes a pre-release), or Actions → Release
#             → Run workflow with a version (empty = build only).
#   In-app updates: every build is signed with the updater key (secrets
#             TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]) and the release gets a
#             latest.json (scripts/update-feed.py) that the app checks.
#   Test run: push a commit to any branch whose message contains
#             [build installers] (builds, no release; the installers are
#             attached to the run as artifacts)
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.2.0 (v0.2.0-beta.1 for a pre-release). Empty = build only."
        required: false
        default: ""

permissions:
  contents: write

# One build per commit at a time; a later push never cancels a build in progress.
concurrency:
  group: release-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      app: ${{ steps.plan.outputs.app }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never pasted into the script.
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag=""
          build=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            build=true
            [[ -n "$INPUT_VERSION" ]] && tag="v${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$version is already released; nothing to publish."
            else
              tag="v$version"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            tag="beta-latest"
          fi
          [[ -n "$tag" || "$MESSAGE" == *"[build installers]"* ]] && build=true
          # Installers want plain x.y.z; a beta suffix only goes on the release.
          app="$version"
          [[ "$tag" == v* ]] && app="${tag#v}" && app="${app%%-*}"
          # Beta builds check the beta-latest update feed, stable builds Latest's.
          channel=stable
          [[ "$tag" == beta-latest ]] && channel=beta
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "build=$build tag=${tag:-none} app=$app"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            voice_test: true
          - name: macOS-Intel
            os: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
            voice_test: false # cross-built on Apple Silicon, can't run here
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            voice_test: true
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            voice_test: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/voice-helper -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Built-in voice (helper, engine, espeak-ng data, Kokoro)
        run: python scripts/fetch-voice.py --target ${{ matrix.target }}

      - name: Voice test (the Kokoro voices speak)
        if: matrix.voice_test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }} speaks_with_the_bundled_voice -- --ignored --nocapture

      - name: Build
        env:
          # Signs the in-app update files (public key in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled in: which update feed the app reads, and its beta build number.
          APEXNORTH_CHANNEL: ${{ needs.plan.outputs.channel }}
          APEXNORTH_BUILD: ${{ github.run_number }}
          APP_VERSION: ${{ needs.plan.outputs.app }}
        run: |
          updater=false
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] && updater=true
          npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"$APP_VERSION\",\"bundle\":{\"createUpdaterArtifacts\":$updater}}"

      - name: Collect installers
        run: |
          b=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          # Copies a file and, when the build was signed, its update signature.
          take() { cp "$1" "out/$2"; [[ -f "$1.sig" ]] && cp "$1.sig" "out/$2.sig"; true; }
          case "${{ matrix.name }}" in
            macOS-*)
              take "$(ls $b/dmg/*.dmg | head -1)" "ApexNorth-${{ matrix.name }}.dmg"
              # The in-app update for macOS is the zipped .app, not the dmg.
              tgz="$(ls $b/macos/*.app.tar.gz 2>/dev/null | head -1)"
              [[ -n "$tgz" ]] && take "$tgz" "ApexNorth-${{ matrix.name }}.app.tar.gz" ;;
            Windows) take "$(ls $b/nsis/*-setup.exe | head -1)" "ApexNorth-Windows-Setup.exe" ;;
            Linux)
              take "$(ls $b/appimage/*.AppImage | head -1)" "ApexNorth-Linux.AppImage"
              take "$(ls $b/deb/*.deb | head -1)" "ApexNorth-Linux.deb" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ApexNorth-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    # Two beta pushes in a row publish one after the other.
    concurrency:
      group: publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Release notes
        run: |
          if [[ "$TAG" == beta-latest ]]; then
            {
              echo "**Test build** from the \`beta\` branch, commit ${GITHUB_SHA::7}. It may have bugs; the regular version is under [Latest](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
              echo
              git log -1 --format='Latest change: %s'
              echo
              cat .github/release-notes.md
            } > notes.md
            # One rolling beta: replace the previous one and its tag.
            gh release delete beta-latest --cleanup-tag --yes || true
          else
            cp .github/release-notes.md notes.md
          fi
      - name: Update feed (latest.json)
        # The version must match the one the files were signed for, so the beta
        # build number goes in the notes ("beta.42: ..."), not the version.
        env:
          VERSION: ${{ needs.plan.outputs.app }}
          BETA_BUILD: ${{ needs.plan.outputs.channel == 'beta' && github.run_number || '' }}
        run: python3 scripts/update-feed.py out "$VERSION" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" $BETA_BUILD
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when it doesn't exist yet.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG == 'beta-latest' && format('ApexNorth Beta ({0})', needs.plan.outputs.app) || format('ApexNorth {0}', env.TAG) }}
          prerelease: ${{ env.TAG == 'beta-latest' || contains(env.TAG, '-') }}
          make_latest: ${{ env.TAG != 'beta-latest' && !contains(env.TAG, '-') }}
          generate_release_notes: ${{ env.TAG != 'beta-latest' }}
          body_path: notes.md
          files: out/*
