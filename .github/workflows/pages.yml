# Publishes the website (site/) to GitHub Pages at https://apexnorth.app.
# One-time setup: Settings → Pages → Source: GitHub Actions, custom domain
# apexnorth.app, and the domain's DNS pointed at GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -R site/. _site/
          rm -f _site/README.md
          cp docs/screenshots/*.jpg _site/screenshots/
          cp src-tauri/icons/128x128@2x.png _site/icon.png
          cp install.sh install.ps1 _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
