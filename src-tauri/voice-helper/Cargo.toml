[package]
name = "apexnorth-voice"
version = "0.1.0"
description = "ApexNorth voice helper: speaks Piper and Kokoro voices with sherpa-onnx (espeak-ng)"
authors = ["Eleven North"]
edition = "2021"
# This program loads espeak-ng (GPL-3.0), so it is GPL too. It runs as its
# own process; the ApexNorth app only sends it text over a pipe.
license = "GPL-3.0-or-later"
publish = false

# Its own workspace, separate from the app.
[workspace]

[dependencies]
libloading = "0.8"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
